# CI for cel-wasm.
#
# SHAPE.  Work is split by LINK MODE across parallel jobs, because the
# mode — not the test count — is what costs:
#
#     29 e2e suites, static   36.3 min
#     the same 29, dynamic     5.3 min
#     97 other targets        10.0 min
#
# Static mode re-verifies LINKING, not semantics: identical assertions,
# with the runtime compiled in rather than imported.  Link-mode breaks
# come from BUILD/toolchain changes, not from editing a kernel, so they
# do not need to gate every review round-trip.
#
#   pull_request  fast lane + dynamic conformance      (~20 min)
#   push (master) the above PLUS static lane + static
#                 conformance, all in parallel         (~40 min)
#
# Nothing is dropped — static still gates master, so a link-mode
# regression cannot reach a release.  It just stops serialising behind
# the fast feedback a PR author is waiting on.
#
# Each lane selects targets by NAME, via `bazel query filter(...)`, and
# passes explicit labels.  That matters: explicit labels also run the
# `manual`-tagged targets, which `bazel test //...` silently skips and
# which carry the load-bearing e2e assertions.  The old
# run_full_suite.sh pass is therefore folded into the lanes rather than
# tacked on after them.
#
# Cache: a bazel disk cache keyed on MODULE.bazel + the cel-cpp pin.
# Cold runs compile cel-cpp from source (~13-15 min) and EVERY lane pays
# it independently — that tax is what docker/Dockerfile.ci exists to
# remove.
#
# Sanitizer legs: ubuntu-24.04, matrixed over ASan and TSan
# (`--config=asan` / `--config=tsan`, defined in .bazelrc).  They run
# the same target set as the primary leg minus the conformance gate —
# see the job comment for why.
#
# macOS (Apple Silicon) leg: workflow_dispatch only.  The project is
# developed and pre-push-gated on Apple Silicon locally, so a per-push
# macOS job is redundant coverage at 10x the runner cost.
name: ci

on:
  push:
    branches: [master]
    # Markdown cannot affect the build or tests; skipping doc-only
    # pushes also stops them cancelling a long in-flight run (the
    # concurrency group below) before its disk cache is saved.
    paths-ignore:
      - "**.md"
      - "doc/img/**"
      # Published benchmark tables (md + csv) can't affect tests.
      - "benchmark/eval/results/**"
      # Docs-site config only affects the Pages build.
      - "mkdocs.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the macOS (Apple Silicon) leg"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- runs on every PR and every master push -------------------------
  # Everything except the static-link duplicates.  Explicit labels from
  # the query, so `manual`-tagged targets run here too.
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: scripts/ci_free_disk.sh

      # No-op unless the job runs in the warm CI image; fails loudly if
      # that image was built for different pins (docker/Dockerfile.ci).
      - name: Verify CI image freshness
        run: scripts/ci_check_image_stamp.sh

      - name: Install host deps (mirrors docker/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld tzdata tzdata-legacy

      - name: Fetch vendored cel-cpp (pinned SHA)
        run: third_party/fetch_cel_cpp.sh

      - name: Restore bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'third_party/cel-cpp.sha') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Point bazel at the disk cache
        run: echo "build --disk_cache=$HOME/bazel-disk-cache" > user.bazelrc

      - name: Test (all but static-link)
        run: |
          targets=$(bazel query 'tests(//...) except filter("_static$", tests(//...))' \
                      2>/dev/null | grep -v cel_oracle_property_test)
          echo "$targets" | wc -l | xargs echo "targets:"
          bazel test --test_output=errors $targets

      - name: Disk usage report
        if: always()
        run: |
          df -h /
          du -sh ~/bazel-disk-cache ~/.cache/bazel 2>/dev/null || true

      - name: Prune bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        run: scripts/ci_prune_disk_cache.py "$HOME/bazel-disk-cache" 4

  conformance-dynamic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: scripts/ci_free_disk.sh

      # No-op unless the job runs in the warm CI image; fails loudly if
      # that image was built for different pins (docker/Dockerfile.ci).
      - name: Verify CI image freshness
        run: scripts/ci_check_image_stamp.sh

      - name: Install host deps (mirrors docker/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld tzdata tzdata-legacy

      - name: Fetch vendored cel-cpp (pinned SHA)
        run: third_party/fetch_cel_cpp.sh

      - name: Restore bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'third_party/cel-cpp.sha') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Point bazel at the disk cache
        run: echo "build --disk_cache=$HOME/bazel-disk-cache" > user.bazelrc

      - name: Conformance (dynamic)
        run: scripts/check_conformance_monotonic.sh --mode dynamic

      - name: Disk usage report
        if: always()
        run: |
          df -h /
          du -sh ~/bazel-disk-cache ~/.cache/bazel 2>/dev/null || true

      - name: Prune bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        run: scripts/ci_prune_disk_cache.py "$HOME/bazel-disk-cache" 4

  # ---- master only ----------------------------------------------------
  # The expensive half.  Parallel with the lanes above, so it sets the
  # wall-clock floor instead of adding to it.
  static:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: scripts/ci_free_disk.sh

      # No-op unless the job runs in the warm CI image; fails loudly if
      # that image was built for different pins (docker/Dockerfile.ci).
      - name: Verify CI image freshness
        run: scripts/ci_check_image_stamp.sh

      - name: Install host deps (mirrors docker/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld tzdata tzdata-legacy

      - name: Fetch vendored cel-cpp (pinned SHA)
        run: third_party/fetch_cel_cpp.sh

      - name: Restore bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'third_party/cel-cpp.sha') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Point bazel at the disk cache
        run: echo "build --disk_cache=$HOME/bazel-disk-cache" > user.bazelrc

      - name: Test (static-link)
        run: |
          targets=$(bazel query 'filter("_static$", tests(//...))' 2>/dev/null)
          echo "$targets" | wc -l | xargs echo "targets:"
          bazel test --test_output=errors $targets

      - name: Disk usage report
        if: always()
        run: |
          df -h /
          du -sh ~/bazel-disk-cache ~/.cache/bazel 2>/dev/null || true

      - name: Prune bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        run: scripts/ci_prune_disk_cache.py "$HOME/bazel-disk-cache" 4

  conformance-static:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: scripts/ci_free_disk.sh

      # No-op unless the job runs in the warm CI image; fails loudly if
      # that image was built for different pins (docker/Dockerfile.ci).
      - name: Verify CI image freshness
        run: scripts/ci_check_image_stamp.sh

      - name: Install host deps (mirrors docker/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld tzdata tzdata-legacy

      - name: Fetch vendored cel-cpp (pinned SHA)
        run: third_party/fetch_cel_cpp.sh

      - name: Restore bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'third_party/cel-cpp.sha') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Point bazel at the disk cache
        run: echo "build --disk_cache=$HOME/bazel-disk-cache" > user.bazelrc

      - name: Conformance (static)
        run: scripts/check_conformance_monotonic.sh --mode static

      - name: Disk usage report
        if: always()
        run: |
          df -h /
          du -sh ~/bazel-disk-cache ~/.cache/bazel 2>/dev/null || true

      - name: Prune bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        run: scripts/ci_prune_disk_cache.py "$HOME/bazel-disk-cache" 4

  # Sanitizer legs — ASan and TSan, one job each.  `fail-fast: false`
  # so an ASan finding doesn't cancel the TSan run: they surface
  # different bug classes and we want both reports from one push.
  #
  # Each sanitizer is its own bazel build tree (a `--copt` change
  # re-keys every action), so each gets its own disk cache; sharing one
  # key would make every run evict the other's objects and stay cold.
  #
  # Scope is `//...` plus the manual-tagged targets, NOT the
  # conformance gate: the corpus runner is by far the longest job in
  # the suite and instrumentation multiplies that, while the code paths
  # it exercises are the same compile→eval paths the e2e manual targets
  # already drive under the sanitizer.  Run it by hand when a
  # sanitizer-relevant change lands in the runtime:
  #     scripts/run_full_suite.sh --config=asan
  test-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      # Mandatory here, not optional: an instrumented tree is LARGER
      # than the plain one that was already exhausting the runner, so
      # this lane cannot fit without reclaiming the preinstalled SDKs.
      - name: Free disk space
        run: scripts/ci_free_disk.sh

      # No-op unless the job runs in the warm CI image; fails loudly if
      # that image was built for different pins (docker/Dockerfile.ci).
      - name: Verify CI image freshness
        run: scripts/ci_check_image_stamp.sh

      # `llvm` on top of the other lanes' deps: it supplies
      # llvm-symbolizer, without which a sanitizer report is a list of
      # raw addresses.
      - name: Install host deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm tzdata tzdata-legacy

      - name: Fetch vendored cel-cpp (pinned SHA)
        run: third_party/fetch_cel_cpp.sh

      - name: Restore bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ matrix.sanitizer }}-${{ hashFiles('MODULE.bazel', 'third_party/cel-cpp.sha') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ matrix.sanitizer }}-

      - name: Point bazel at the disk cache and the symbolizer
        # .bazelrc try-imports user.bazelrc; `test` inherits `build` flags.
        # The symbolizer lives at an unversioned path on some images and
        # only under /usr/lib/llvm-N on others — resolve it here rather
        # than hardcoding a path in the committed .bazelrc, which also
        # has to work on macOS.
        run: |
          echo "build --disk_cache=$HOME/bazel-disk-cache" > user.bazelrc
          sym="$(command -v llvm-symbolizer || true)"
          if [[ -z "$sym" ]]; then
            sym="$(ls -1 /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | tail -n1 || true)"
          fi
          if [[ -n "$sym" ]]; then
            echo "using symbolizer: $sym"
            echo "test --test_env=ASAN_SYMBOLIZER_PATH=$sym" >> user.bazelrc
            echo "test --test_env=TSAN_OPTIONS=external_symbolizer_path=$sym" >> user.bazelrc
          else
            echo "::warning::llvm-symbolizer not found; sanitizer reports will be unsymbolized"
          fi

      # One `bazel test` rather than build-then-test: `test` already
      # builds, and the duplicate pass was dropped from the other lanes
      # for the same reason.  Scope is `//...` plus the manual-tagged
      # targets; conformance is deliberately excluded (see the job
      # comment above).
      - name: Test (unit + manual-tagged)
        run: scripts/run_full_suite.sh --quick --config=${{ matrix.sanitizer }}

      - name: Disk usage report
        if: always()
        run: |
          df -h /
          du -sh ~/bazel-disk-cache ~/.cache/bazel 2>/dev/null || true

      - name: Prune bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        run: scripts/ci_prune_disk_cache.py "$HOME/bazel-disk-cache" 4

      - name: Save bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  test-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored cel-cpp (pinned SHA)
        run: third_party/fetch_cel_cpp.sh

      - name: Restore bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'third_party/cel-cpp.sha') }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-

      - name: Point bazel at the disk cache
        # .bazelrc try-imports user.bazelrc; `test` inherits `build` flags.
        run: echo "build --disk_cache=$HOME/bazel-disk-cache" > user.bazelrc

      # `bazel test //...` builds everything the build step would.
      - name: Test
        run: bazel test --test_output=errors //...

      - name: Manual-tagged targets + dual-mode conformance gate
        run: scripts/run_full_suite.sh

      - name: Disk usage report
        if: always()
        run: |
          df -h /
          du -sh ~/bazel-disk-cache ~/.cache/bazel 2>/dev/null || true

      # Same unbounded-growth problem as the Linux leg; macOS runners
      # have less free space to start with, not more.
      - name: Prune bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        run: scripts/ci_prune_disk_cache.py "$HOME/bazel-disk-cache" 4

      - name: Save bazel disk cache
        if: always() && steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
