# Builds the mkdocs-material site (mkdocs.yml) and publishes it to GitHub
# Pages. One-time setup by the repo owner: Settings → Pages → Source =
# "GitHub Actions". After that this deploys on every push to master that
# touches the docs.
name: docs

on:
  push:
    # `m29-spa` is included so the in-browser playground SPA deploys to the
    # live Pages site from that feature branch (the demo lives there until
    # it merges to master).
    branches: [master, m29-spa]
    paths:
      - doc/**
      - mkdocs.yml
      - mkdocs-requirements.txt
      - .github/workflows/pages.yml
      # The in-browser playground SPA is published into site/playground/,
      # so its sources redeploy the site too.
      - bindings/ts/**
  workflow_dispatch:

# Least-privilege token scoped to a Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Our requirements file isn't named requirements.txt, so the
          # cache keyer needs to be pointed at it explicitly.
          cache-dependency-path: mkdocs-requirements.txt
      - run: pip install -r mkdocs-requirements.txt
      # Non-strict: some prose still links to out-of-tree repo files
      # (../conformance/README.md, …) that resolve on GitHub but warn
      # here; those are migrated incrementally, not build-breaking.
      - run: mkdocs build --verbose

      # Build the in-browser playground SPA and publish it under
      # site/playground/.  This is a pure-TypeScript build — no Bazel: it
      # uses the committed bindings/ts/web/public/compiler.wasm asset plus
      # the @cel-wasm/eval + @cel-wasm/compiler packages, all from source.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/ts/package-lock.json
      - name: Install SPA workspace deps
        working-directory: bindings/ts
        run: npm ci
      - name: Build SPA workspace deps + the playground
        working-directory: bindings/ts
        # The Vite base must match the Pages subpath the SPA is served
        # from (site/playground/ → /cel-spec-wasm/playground/).
        env:
          VITE_BASE: /cel-spec-wasm/playground/
        run: |
          npm run build -w @cel-wasm/eval
          npm run build -w @cel-wasm/compiler
          npm run build -w @cel-wasm/web
      - name: Stage the SPA into the published site
        # The Vite build emits bindings/ts/web/dist/web/ (including the
        # 54 MB compiler.wasm copied from public/).  Place it at
        # site/playground/ so it serves at /cel-spec-wasm/playground/.
        run: |
          mkdir -p site/playground
          cp -R bindings/ts/web/dist/web/. site/playground/
          test -f site/playground/compiler.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
