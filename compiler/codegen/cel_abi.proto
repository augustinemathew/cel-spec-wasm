// Schema of the `cel.abi` WASM custom section emitted by celwasmc.
//
// Contract (see `doc/wasm-compiler-design.md` Appendix A and §7):
//   - Every `.wasm` the compiler emits carries one `cel.abi` custom
//     section whose payload is a serialized `CelAbi` message.
//   - Hosts MUST parse and verify this section before instantiating
//     the module; it is the only place the compiler records which
//     host callbacks it relies on, how intern IDs map to their
//     source-level identities, and what memory layout the emitted
//     runtime expects.
//
// Design decisions worth knowing when extending this schema:
//   - Field numbers mirror the design-doc appendix so the two can
//     be cross-referenced at a glance.  Do not renumber.
//   - `cel.expr.CheckedExpr` is embedded whole rather than
//     re-serialized: this lets the host do its own RejectDyn /
//     analysis passes without a second parse/check pipeline.
//   - Intern tables (`fields`, future regex / error-message tables)
//     are kept as `repeated` messages with explicit `id` fields.
//     This lets the compiler allocate IDs densely from zero but the
//     host does not have to assume contiguous numbering.
//   - `MemoryLayout` is emitted even for M2 modules with no
//     non-trivial allocations: downstream tooling reads it
//     unconditionally, so making it optional would add a branch
//     at every reader.

syntax = "proto3";

package celwasm;

import "cel/expr/checked.proto";

// One row of the field intern table.  `id` is the i32 the emitted
// WASM passes to `cel_host.get_field` / `cel_host.has_field` in
// place of a raw proto field number.  The host resolves it at
// instantiation time: for proto-backed messages `field_number` is
// non-zero and the host may short-circuit to a cached
// `FieldDescriptor*`; for non-proto backings (JSON, maps) the host
// resolves by `name` instead.  `field_number == 0` is the sentinel
// for "not proto-resolvable" — forward-compat with container /
// comprehension backings that don't have proto descriptors.
//
// `name` is always populated: attribute-pattern matching (partial
// eval, design §4.3) compares qualifier paths by name so the match
// semantics are independent of the backing store.
message FieldEntry {
  uint32 id = 1;
  uint32 field_number = 2;
  string name = 3;
}

// Which host callbacks the emitted module actually relies on.  The
// host is free to reject a module whose `FunctionSet` names an
// entry point it does not implement.  Kept as a flat set of names
// so future additions do not bump a schema version.
message FunctionSet {
  repeated string required_imports = 1;
}

// Memory-layout hints.  The compiler can pre-reserve space for
// interned literals / tables and communicates that to the host via
// `initial_pages`; the host may also impose a cap through
// `max_pages` at instantiation time (0 = no cap).
message MemoryLayout {
  uint32 initial_pages = 1;
  uint32 max_pages = 2;
}

// Top-level payload of the `cel.abi` custom section.
message CelAbi {
  // Format version for the whole schema.  Bump on any field removal
  // or semantics change; additive changes keep version the same.
  uint32 version = 1;

  // The exact CEL source string the compiler read.  Kept for
  // diagnostics; hosts that want a canonicalized form should
  // re-render from `checked` rather than parse this.
  string cel_source = 2;

  // The fully type-checked AST.  Every `Expr` here has a matching
  // entry in `CheckedExpr.type_map` and, for unchecked nodes that
  // cel-cpp inserted during macro expansion, a `source_info` entry.
  cel.expr.CheckedExpr checked = 3;

  // Intern table for field selects.  Codegen emits one entry per
  // distinct `(proto_field_number, name)` pair it references, and
  // uses the row's `id` as the i32 argument to `cel_host.get_field`
  // / `cel_host.has_field` at the call site.  Keeping this in the
  // ABI section (rather than in linear-memory data) lets the host
  // build its dispatch tables at instantiation time without any
  // runtime surface changes.
  repeated FieldEntry fields = 4;

  FunctionSet  function_set = 8;
  MemoryLayout layout       = 9;
}
