// E2E test fixture messages.
//
// Deliberately shaped like a realistic user-facing domain (a loyalty-
// program customer profile) rather than borrowed from descriptor.proto:
// the wire-type coverage is intentional — one scalar of each CEL-
// relevant proto type — and the field numbers are stable so the tests
// read as scenarios, not as "some field that happens to be #3 on
// DescriptorProto."
//
// Scalar fields below cover every payload-load branch in
// `LoadSelectPayload` (expr_lower.cc):
//
//   string   name           — kString  (pass-through)
//   bytes    session_token  — kBytes   (pass-through)
//   int32    age            — kInt  (i64.load, signed proto int32→CEL int)
//   int64    user_id        — kInt  (i64.load)
//   uint32   priority       — kUint (i64.load unsigned)
//   uint64   balance_cents  — kUint (i64.load unsigned)
//   double   credit_score   — kDouble (f64.load)
//   bool     is_premium     — kBool (i32.load)
//
// The nested `Address` message is here so G4 (nested select + message
// equality) has a ready-made submessage to reference without another
// churn in this file.
//
// Scalar singletons cover every `LoadSelectPayload` arm (M2);
// `metadata` (map<string,string>) and `tier_quotas` (map<string,int32>)
// cover the M3 proto-map dispatch — `ProtoBacking::ReadField` on a
// MAP field returns `Value::HostMap(ProtoMap{…})`, which the
// `kCallExpr(_[_])` arm dispatches to `cel_host.cel_map_lookup`.
// Repeated / enum coverage belongs to a later milestone.

syntax = "proto3";

package celwasm.testdata;

message Address {
  string city = 1;
  string country = 2;
}

message Customer {
  string name           = 1;
  int32  age            = 2;
  int64  user_id        = 3;
  uint32 priority       = 4;
  uint64 balance_cents  = 5;
  double credit_score   = 6;
  bool   is_premium     = 7;
  bytes  session_token  = 8;
  Address billing_address = 9;

  // M3 — proto map fields.  String-keyed and int-keyed variants so
  // the `cel_host.cel_map_lookup` dispatch path can be exercised
  // for both common key kinds without leaning on `host_fixture_proto3`'s
  // exhaustive-key matrix (that file is owned by the host-surface
  // unit tests; this fixture is the e2e domain stand-in).
  map<string, string> metadata    = 10;
  map<int32, int32>   tier_quotas = 11;

  // M4 — proto repeated field.  Scalar-element only; an exhaustive
  // matrix per cpp_type lives in `host_fixture_proto3.proto`'s
  // `rep_*` fields.  Used by `m4_test.cc` to exercise the
  // `cel_host.cel_list_at` dispatch path on `customer.tags[i]`.
  repeated string tags = 12;
}
