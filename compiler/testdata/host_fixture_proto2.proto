// Proto2 counterpart of host_fixture_proto3.proto.  Same field shape,
// but `optional` gives every singular scalar explicit presence — so the
// proto2-specific tests can pin the "set to default still has HasField
// == true" behaviour that distinguishes proto2 from proto3.

syntax = "proto2";

package celwasm.testdata;

message HostMsg2 {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SEVEN = 7;
  }

  optional bool     b        = 1;
  optional int32    i32      = 2;
  optional int64    i64      = 3;
  optional uint32   u32      = 4;
  optional uint64   u64      = 5;
  optional sint32   si32     = 6;
  optional sint64   si64     = 7;
  optional fixed32  fx32     = 8;
  optional fixed64  fx64     = 9;
  optional sfixed32 sfx32    = 10;
  optional sfixed64 sfx64    = 11;
  optional float    f32      = 12;
  optional double   f64      = 13;
  optional string   s        = 14;
  optional bytes    by       = 15;
  optional Kind     kind     = 16;
  optional HostMsg2 inner    = 17;
  repeated int32    rep_i32  = 18;
}
