// Proto3 fixture for cel_host unit tests: one message with a field of
// every CEL-relevant proto3 wire type plus an enum, a self-recursive
// message, and a repeated scalar.
//
// Field numbers are deliberately non-contiguous across wire types so
// off-by-one mistakes in the resolver or host dispatcher cannot pass
// silently.

syntax = "proto3";

package celwasm.testdata;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message HostMsg3 {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SEVEN = 7;
  }

  bool     b        = 1;
  int32    i32      = 2;
  int64    i64      = 3;
  uint32   u32      = 4;
  uint64   u64      = 5;
  sint32   si32     = 6;
  sint64   si64     = 7;
  fixed32  fx32     = 8;
  fixed64  fx64     = 9;
  sfixed32 sfx32    = 10;
  sfixed64 sfx64    = 11;
  float    f32      = 12;
  double   f64      = 13;
  string   s        = 14;
  bytes    by       = 15;
  Kind     kind     = 16;
  HostMsg3 inner    = 17;

  // M4.D fixture coverage — one repeated field per representative
  // cpp_type so ProtoList reflection paths can be exhaustively
  // asserted without adding new top-level messages.  Field numbers
  // stay contiguous in the 18..27 block.  `repeated map` is not
  // legal per descriptor.proto.
  repeated int32  rep_i32 = 18;
  repeated string rep_s   = 24;
  repeated bool   rep_b   = 25;
  repeated double rep_f64 = 26;
  repeated HostMsg3 rep_msg = 27;

  // M3.G fixture coverage — one map field per allowed key kind so
  // ProtoMap reflection paths can be exhaustively asserted without
  // adding new top-level messages.  Values are scalars or messages;
  // repeated/map values are not legal as proto map values per
  // descriptor.proto.
  map<string, int32>  str_to_i32 = 19;
  map<int64,  string> i64_to_str = 20;
  map<uint32, double> u32_to_f64 = 21;
  map<bool,   int64>  bool_to_i64 = 22;
  map<string, HostMsg3> str_to_msg = 23;

  // M7 §6.2 — oneof discipline (proto3).  Same regression as
  // HostMsg2.which; both syntax versions go through the same
  // Reflection::SetField path so M7.C tests must cover both.
  oneof which3 {
    int64  oneof_i64 = 28;
    string oneof_s   = 29;
  }

  // M7-A — google.protobuf.Any pack / unpack coverage.  Singular,
  // repeated, and map<string, Any> shapes so the AssignMessageOrPack
  // helper is exercised through every cpp_type-MESSAGE call site.
  google.protobuf.Any            single_any    = 30;
  repeated google.protobuf.Any   repeated_any  = 31;
  map<string, google.protobuf.Any> map_str_to_any = 32;

  // Well-known Duration / Timestamp / JSON Value / Struct / ListValue
  // pack coverage (write-side WKT message synthesis from a CelValue).
  google.protobuf.Duration       single_duration   = 33;
  google.protobuf.Timestamp      single_timestamp  = 34;
  google.protobuf.Value          single_value      = 35;
  google.protobuf.Struct         single_struct     = 36;
  google.protobuf.ListValue      single_list_value = 37;
  repeated google.protobuf.Timestamp repeated_timestamp = 38;
  map<string, google.protobuf.Timestamp> map_str_to_ts = 39;
}
