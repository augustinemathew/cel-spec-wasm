// Proto2 counterpart of host_fixture_proto3.proto.  Same field shape,
// but `optional` gives every singular scalar explicit presence — so the
// proto2-specific tests can pin the "set to default still has HasField
// == true" behaviour that distinguishes proto2 from proto3.

syntax = "proto2";

package celwasm.testdata;

message HostMsg2 {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_SEVEN = 7;
  }

  optional bool     b        = 1;
  optional int32    i32      = 2;
  optional int64    i64      = 3;
  optional uint32   u32      = 4;
  optional uint64   u64      = 5;
  optional sint32   si32     = 6;
  optional sint64   si64     = 7;
  optional fixed32  fx32     = 8;
  optional fixed64  fx64     = 9;
  optional sfixed32 sfx32    = 10;
  optional sfixed64 sfx64    = 11;
  optional float    f32      = 12;
  optional double   f64      = 13;
  optional string   s        = 14;
  optional bytes    by       = 15;
  optional Kind     kind     = 16;
  optional HostMsg2 inner    = 17;
  repeated int32    rep_i32  = 18;

  // M7 §6.3 — proto2 explicit-default fields.  Reads on these
  // return the descriptor-stated default when unset; `has(...)`
  // returns true only after an explicit set.  Fields that
  // M7-construction tests use to verify the eval-time read path
  // honours `[default = X]`.
  optional int32  default_i32  = 19 [default = 42];
  optional string default_s    = 20 [default = "hello"];
  optional bool   default_b    = 21 [default = true];

  // M7 §6.2 — oneof discipline.  Setting one arm clears any
  // sibling; `has(...)` returns true only on the most-recently-
  // set arm.  Proto reflection enforces this on `SetField`; M7's
  // cel_set_field inherits that for free, regression-asserted
  // by ProtoLiteralOneofE2ETest.
  oneof which {
    int64  oneof_i64 = 22;
    string oneof_s   = 23;
  }
}
