// Schema of the `cel.abi` WASM custom section emitted by
// compiler/.  The compiler writes one `CelAbi` message into the
// section, the host (Engine::Plan) decodes it at load time to build
// its runtime dispatch tables.
//
// Fresh v2 schema — intentionally decoupled from v1's
// compiler/codegen/cel_abi.proto.  Rationale: v2's host surface
// (cel::Compiler / cel::Engine / cel::Instance) doesn't depend on
// v1 types.
//
// Design decisions:
//   - Field numbers are dense and locked.  Extending a message is
//     additive only — never renumber.
//   - `CelType` is recursive and carries enough information for the
//     host marshal to pick the right `Value → CelValue` encoder.
//     Derivable facts (like the internal `Repr` enum) stay derived
//     at decode time; wire payload is minimal.
//   - MAP / LIST in `CelType` are first-class declared variable
//     types — the checker accepts them and codegen routes through
//     the kHost dispatch arm (see `rewrite/map-list-dispatch.md`).
//   - No `cel.expr.CheckedExpr` on the wire.  v1 embedded the full
//     checked AST for host-side re-analysis; v2's host doesn't run
//     a second pass, so the AST stays compile-time-only.
//
// Consumed by eval/internal/abi_decode.{h,cc}.
// Produced by compiler/internal/compile.cc.

syntax = "proto3";

package celwasm.abi;

// One declared free variable.  Emitted by compile.cc from
// `StaticLayout::variables`; consumed by Engine::Plan to build the
// variable lookup table `Instance::Eval(Activation)` uses to marshal
// bound values into their 24-byte workspace slots.
//
//   name         the source-level identifier (matches Activation::Bind).
//   local_index  dense index into `$eval`'s wasm locals — 0, 1, 2 ...
//                in first-referenced order.  Indexes cel.abi.variables[].
//   slot_offset  absolute linear-memory byte offset of the 24-byte
//                CelValue cell this variable occupies.  The host
//                marshal writes CelValue bytes at this offset before
//                calling $eval; the lowered body reads `local.get
//                local_index`, whose value was set to slot_offset by
//                the $eval prelude.
//   repr         numeric mirror of `ir::Repr` (annotations.h).  Used
//                by the host marshal to pick the right
//                `Value → CelValue` encoder.  Values are stable on
//                wire; any new Repr lands as an additional numeric
//                value, never a renumbering.
//
// Rich type info (message FQN, list<T> element type, map<K,V>
// parameters) is NOT on the wire.  The host marshal only needs
// Repr to pick an encoder; if a future feature (introspection,
// per-type dispatch) needs the full type, it lands as an additive
// field (reserved slot 5) — the wire stays backward-compatible.
message VariableEntry {
  string name = 1;
  uint32 local_index = 2;
  uint32 slot_offset = 3;
  uint32 repr = 4;
  // reserved 5;  // future: full CelType for introspection / M6
}

// One row of the field intern table.  Populated by codegen at
// kSelect lowering.
//
//   id            dense intern index in [1, N].  0 is the reserved
//                 sentinel "no field id": fields[0] is an empty
//                 placeholder row (pushed once before lowering;
//                 expr_lower.cc), codegen never assigns it to a real
//                 select, and the runtime maps a field_ref_id of 0 to
//                 field-not-found (cel_host.cc).  Mirrors the 0-sentinel
//                 of AttributeEntry.id / TypeEntry.id.
//   field_number  proto wire field number, or 0 when the backing is
//                 name-only / not proto-resolvable (the non-proto
//                 backings of M6+).  This — NOT id==0 — is the
//                 "not proto-resolvable" marker; such a row is a normal
//                 interned field (id >= 1) that just lacks a wire number.
//   name          always populated; attribute-pattern matching
//                 compares by name regardless of backing.
//   owner_fqn     fully-qualified name of the message type that owns
//                 this field.  Resolved at Plan time against the
//                 process-wide DescriptorPool to obtain the
//                 FieldDescriptor used by ProtoBacking.
message FieldEntry {
  uint32 id = 1;
  uint32 field_number = 2;
  string name = 3;
  string owner_fqn = 4;
}

// One row of the attribute intern table (partial-eval; see
// `rewrite/m2-ident-select-unknowns.md`).  Populated when
// ResolvePass interns an ident-rooted select chain; consumed by
// the cel_host trampoline at runtime to match against the active
// unknown-pattern set.
//
//   id          dense intern index in [1, N]; 0 is the sentinel "no
//               attribute id", stamped on any node that is not
//               ident-rooted (a literal, a call result, etc.) so the
//               runtime treats it as "no unknown-pattern match possible".
//   variable    root variable name (the ident at the base of the chain).
//   qualifiers  ordered field-select names from root to this node.
//
// ResolvePass interns the root ident with empty qualifiers, then each
// `.field` select copies the operand's row and appends `field` — so
// every PREFIX of a chain gets its own row.  Concrete examples:
//
//   `x`                      -> {variable:"x",       qualifiers:[]}
//   `request.auth`           -> {variable:"request", qualifiers:["auth"]}
//   `request.auth.claims`    -> {variable:"request", qualifiers:["auth","claims"]}
//        (compiling this last one interns all three rows above, because
//         the operand of each select is interned first.)
//   `1 + 2`, `f().g`         -> id 0 (not ident-rooted; no row emitted).
//
// FieldEntry vs AttributeEntry — why both exist (they are populated
// TOGETHER at a `.field` select but answer different runtime questions):
//   - FieldEntry  = HOW to read a field: proto field_number + owner_fqn
//                   + name, consumed by the `cel_get_field` trampoline.
//                   One row PER select SITE; proto-resolution data.
//   - AttributeEntry = WHAT symbolic path this node denotes
//                   (variable + qualifiers), consumed by the unknown-
//                   pattern matcher for partial eval.  INTERNED /
//                   deduplicated per distinct path; carries no proto
//                   data.  A single `cel_get_field` call uses both:
//                   FieldEntry to read, AttributeEntry to decide whether
//                   the result is UNKNOWN (cel_host.cc steps 4 & 5).
//
// Index/key granularity — BY DESIGN, NOT a gap.  Only `.field` selects
// extend `qualifiers`; index/key access (`x[0]`, `m['k']`) never does,
// so `m['a']` and `m['b']` share the one containing attribute.
//
// An UNKNOWN is PRODUCED at two sites, both consulting the same pattern
// set; everything else only PROPAGATES an unknown already produced
// upstream (3VL absorption in cel_runtime.c / the cel_host index/key/
// size trampolines):
//   1. The activation marshal (eval/instance.cc BareVariableUnknownId):
//      a declared variable whose BARE attribute (root + empty
//      qualifiers) is kFull-matched by a pattern gets CEL_UNKNOWN
//      written into its workspace slot instead of a bound value — so
//      the WHOLE variable is opaque.  The verdict is independent of
//      binding (a bound value is ignored; an unknown variable need not
//      be bound).
//   2. The `.field` select trampoline (cel_host.cc RunFieldPrelude →
//      MatchesAnyUnknownPattern): the select produces CEL_UNKNOWN iff
//      its effective attribute (operand ⊕ field name) is kFull-matched.
//      This is the FINER lever — it marks `c.age` unknown while
//      `c.name` stays known, which the whole-variable marshal cannot.
// Together:
//   - pattern `m` (kFull on bare `m`) → the marshal blanks `m`'s slot,
//     and `m[k]`, `size(m)`, `m.field` all become UNKNOWN by absorption.
//   - pattern `c.tier_quotas` (kPartial on bare `c`, kFull at the
//     `.tier_quotas` select) → the select fires and `c.tier_quotas[k]`
//     is UNKNOWN, while `c` itself stays a concrete message.
// What stays UNEXPRESSIBLE: per-element / per-key granularity — `[i]`
// and `[k]` never intern an attribute, so you cannot mark `m['a']`
// unknown while `m['b']` stays known.  Marking the whole container
// blanks every keyed read; there is no pattern between "all of it" and
// a specific field path.  (Verified + pinned by
// e2e/m2_partial_eval_test.cc.)
// `AttributePattern::Parse` REJECTS bracket/key qualifiers (`m["a"]`,
// `xs[3]`): since we never intern an index/key, we don't accept
// patterns we can't honor — they'd silently match nothing.  Pinned by
// e2e/m2_test.cc {MapWholePathUnknownIsCoarseButWorks,
// MapPerKeyUnknownRejectedAtParse}.  (If per-KEY unknowns ever
// become a real need — e.g. lazily-resolved config keys — interning a
// string/int AttributeQualifier on `[key]` lowering is the change;
// list-index granularity is not expected to be needed.)
message AttributeEntry {
  uint32 id = 1;
  string variable = 2;
  repeated string qualifiers = 3;
}

// One row of the message-type intern table.  Populated when
// ResolvePass first encounters a `kStructExpr` with a non-empty
// message_name; consumed by `Engine::Plan` to resolve
// `fully_qualified_name` against the embedder-supplied
// `DescriptorPool` (or `generated_pool()`).  See
// `rewrite/m7-proto-literals.md`.  Mirrors
// `FieldEntry.owner_fqn`'s FQN-resolved-at-Plan-time discipline;
// no descriptor handle on the wire.
//
//   id                     dense index; 0 is the sentinel "no type id".
//   fully_qualified_name   e.g. "celwasm.testdata.HostMsg3" — the
//                          checker-stamped message type name on the
//                          kStructExpr node.
message TypeEntry {
  uint32 id = 1;
  string fully_qualified_name = 2;
}

// Link mode a Program was compiled with.  See
// doc/implementation-plan/rewrite/m28-configurable-linking.md §6.
//
// An enum (not a bool) so future modes — e.g. a hybrid mode that
// statically links a helper subset — land as additive values.
//
//   LINK_MODE_DYNAMIC  the Program imports the runtime helpers from
//                      the `cel` module; the engine instantiates a
//                      separate cel_runtime.wasm and links the two.
//                      Value 0 by design: Programs emitted before
//                      this field existed carry no value, and they
//                      are all dynamically linked — the proto3
//                      default decodes them to the shape they
//                      actually have.
//   LINK_MODE_STATIC   self-contained; the runtime is statically
//                      linked into the Program's wasm bytes.
enum LinkMode {
  LINK_MODE_DYNAMIC = 0;
  LINK_MODE_STATIC = 1;
}

// Top-level payload of the `cel.abi` custom section.
message CelAbi {
  // Schema version of *this proto message*.  Bumped on any field
  // renumbering / removal.  Additive changes keep the version the
  // same.  Hosts MAY reject a module whose version they don't
  // recognise; typically they tolerate forward versions so long as
  // they only consume the fields they know about.  Distinct from
  // `runtime_abi_version` below — that one carries the runtime
  // helper catalogue version the program was compiled against.
  uint32 version = 1;

  // Declared free variables referenced by the expression.
  // Indexed by `local_index`; position i holds the entry whose
  // `local_index == i`.
  repeated VariableEntry variables = 2;

  // Field intern table.
  repeated FieldEntry fields = 3;

  // Attribute intern table.
  repeated AttributeEntry attributes = 4;

  // Message-type intern table.  One row per distinct message
  // FQN constructed by `kStructExpr` in the program.  Index 0 is
  // the reserved sentinel.
  repeated TypeEntry types = 5;

  // Version of the runtime helper catalogue the program was
  // compiled against.  Mirror of `abi::kRuntimeAbiVersion` in
  // `abi/runtime_catalogue.h`.  The engine compares
  // this against its own `kRuntimeAbiVersion` at `Plan` time and
  // rejects mismatches with a clear FailedPrecondition that names
  // both versions — far better than wasmtime's opaque "type
  // mismatch on call $cel_..." trap that would otherwise happen at
  // first call into a renamed / re-aritied helper.
  //
  // `0` is the sentinel "predates ABI versioning"; programs
  // emitted before Slice E carry no value (proto3 default = 0).
  // The engine rejects 0 with a "recompile against this engine's
  // compiler" diagnostic — see Engine::Plan.
  //
  // Bumping policy (mirrors the constant's docstring):
  //   - Helper renamed / removed / arity changed / return shape
  //     changed / namespace renamed   →  bump
  //   - Helper added (additive)        →  no bump (older modules
  //                                       still load; they don't
  //                                       reference the new helper)
  uint32 runtime_abi_version = 6;

  // Link mode the Program was compiled with.  Metadata for embedder
  // tooling (cache validators, signature systems, cross-process
  // Program shipping) — NOT a routing input: the engine routes on
  // import introspection of the wasm bytes themselves, so a Program
  // whose marker disagrees with its actual import shape still loads
  // by its real shape.  See
  // doc/implementation-plan/rewrite/m28-configurable-linking.md §6.
  LinkMode link_mode = 7;
}
