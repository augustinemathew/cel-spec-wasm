// Demo proto used by the proto-bearing demo target
// (`demo_plugin_proto` in BUILD.bazel).  Crosses the
// Component-Model boundary as serialized bytes via the
// `proto(...)` IDL type (m24 §8 + m26 §4.1).

syntax = "proto3";

package acme;


message User {
  string name = 1;
  uint32 age = 2;
  bool verified = 3;
}
