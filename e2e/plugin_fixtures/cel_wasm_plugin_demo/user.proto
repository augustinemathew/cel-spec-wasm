// Demo proto used by the proto-bearing demo target
// (`demo_plugin_proto` in BUILD.bazel).  Crosses the
// Component-Model boundary as serialized bytes via the
// `proto(...)` IDL type (m24 §8 + m26 §4.1).

syntax = "proto3";

package acme;

// LITE_RUNTIME so the guest links protobuf-lite: the full runtime
// drags absl, whose cctz uses std::mutex, which the threadless
// wasip2 libc++ does not provide.  The plugin boundary only needs
// serialize / parse, which MessageLite covers.
option optimize_for = LITE_RUNTIME;

message User {
  string name = 1;
  uint32 age = 2;
  bool verified = 3;
}
