<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Trust boundaries: host process vs wasmtime sandbox.
       Facts: design/00 §4, design/05, user-guide/security-model.
       Hand-authored; keep in sync with the docs. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7681"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- host process -->
  <rect x="12" y="32" width="290" height="256" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="24" y="22" font-size="13" font-weight="600" fill="#8b949e">HOST PROCESS &#183; trusted</text>

  <g font-size="13">
    <rect x="28" y="52" width="258" height="56" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="157" y="76" text-anchor="middle" font-weight="600" fill="#e6edf3">your application</text>
    <text x="157" y="94" text-anchor="middle" font-size="11" fill="#8b949e">protos &#183; policy data</text>

    <rect x="28" y="128" width="258" height="56" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="157" y="152" text-anchor="middle" font-weight="600" fill="#e6edf3">Engine / Instance</text>
    <text x="157" y="170" text-anchor="middle" font-size="11" fill="#8b949e">wasmtime embedder</text>

    <rect x="28" y="204" width="258" height="56" rx="6" fill="#0c2d6b" stroke="#1f6feb"/>
    <text x="157" y="228" text-anchor="middle" font-weight="600" fill="#79c0ff">@host functions</text>
    <text x="157" y="246" text-anchor="middle" font-size="11" fill="#79c0ff">in-process, full trust &#183; ~110 ns/call</text>
  </g>

  <!-- wasmtime sandbox -->
  <rect x="330" y="32" width="330" height="256" rx="10" fill="#04260f" fill-opacity="0.35" stroke="#2ea043" stroke-dasharray="6,4"/>
  <text x="342" y="22" font-size="13" font-weight="600" fill="#3fb950">WASMTIME SANDBOX</text>

  <g font-size="13">
    <rect x="346" y="52" width="298" height="66" rx="6" fill="#0d1117" stroke="#2ea043"/>
    <text x="495" y="76" text-anchor="middle" font-weight="600" fill="#3fb950">compiled expression</text>
    <text x="495" y="94" text-anchor="middle" font-size="11" fill="#8b949e">your CEL, as machine code</text>

    <rect x="346" y="152" width="298" height="66" rx="6" fill="#0d1117" stroke="#2ea043"/>
    <text x="495" y="176" text-anchor="middle" font-weight="600" fill="#3fb950">cel_runtime.wasm kernel</text>
    <text x="495" y="194" text-anchor="middle" font-size="11" fill="#8b949e">shared linear memory</text>
  </g>
  <text x="495" y="252" text-anchor="middle" font-size="11.5" fill="#3fb950">no syscalls &#183; no I/O &#183; bounded memory</text>
  <text x="495" y="270" text-anchor="middle" font-size="11.5" fill="#3fb950">nothing here can reach the host unmediated</text>

  <!-- arrows -->
  <g stroke-width="1.5" fill="none">
    <line x1="286" y1="156" x2="344" y2="156" stroke="#6e7681" marker-end="url(#arr)"/>
    <path d="M 346 100 C 320 130, 300 180, 288 216" stroke="#1f6feb" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
    <line x1="495" y1="118" x2="495" y2="150" stroke="#6e7681" marker-end="url(#arr)"/>
  </g>
  <text x="316" y="140" text-anchor="middle" font-size="11" fill="#8b949e">Plan / Eval</text>
  <text x="296" y="188" text-anchor="start" font-size="10.5" fill="#79c0ff">cel_host trampolines</text>
  <text x="296" y="202" text-anchor="start" font-size="10.5" fill="#79c0ff">(host-mediated)</text>
  <text x="510" y="140" text-anchor="start" font-size="10.5" fill="#8b949e">cel.* calls</text>

  <!-- caption -->
  <text x="336" y="316" text-anchor="middle" font-size="12" fill="#8b949e">custom functions run in your process as host callbacks; expressions never leave the sandbox</text>
</svg>
