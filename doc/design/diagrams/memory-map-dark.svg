<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- One shared linear memory per Instance. Regions not to scale.
       Facts: design/03 §4 (canonical region table), runtime/cel_layout.h,
       compiler/memory_layout.h. Hand-authored; keep in sync with the table. -->

  <text x="16" y="20" font-size="12.5" fill="#8b949e">(memory 4 1024 shared) &#8212; 256 KiB initial, 64 MiB max &#183; defined and exported by cel_runtime.wasm</text>
  <text x="924" y="20" text-anchor="end" font-size="11" fill="#6e7681" font-style="italic">regions not to scale</text>

  <!-- lifetime bands -->
  <g font-size="10.5" font-style="italic">
    <rect x="16" y="36" width="456" height="17" rx="3" fill="#0c2d6b"/>
    <text x="244" y="48.5" text-anchor="middle" fill="#79c0ff">lifetime: module data segments</text>
    <rect x="476" y="36" width="176" height="17" rx="3" fill="#21262d"/>
    <text x="564" y="48.5" text-anchor="middle" fill="#8b949e">process</text>
    <rect x="656" y="36" width="268" height="17" rx="3" fill="#04260f"/>
    <text x="790" y="48.5" text-anchor="middle" fill="#3fb950">Plan / Instance / Eval</text>
  </g>

  <!-- address bar -->
  <g font-size="12.5">
    <rect x="16" y="62" width="48" height="64" fill="#21262d" stroke="#30363d"/>
    <text x="40" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8b949e">rsvd</text>
    <text x="40" y="104" text-anchor="middle" font-size="9.5" fill="#8b949e">0 = absent</text>

    <rect x="64" y="62" width="180" height="64" fill="#0c2d6b" stroke="#1f6feb"/>
    <text x="154" y="86" text-anchor="middle" font-weight="600" fill="#79c0ff">.rodata</text>
    <text x="154" y="102" text-anchor="middle" font-size="10.5" fill="#79c0ff">24-B const CelValue frames</text>
    <text x="154" y="115" text-anchor="middle" font-size="10.5" fill="#79c0ff">+ string/bytes payloads</text>

    <rect x="244" y="62" width="180" height="64" fill="#0d1117" stroke="#1f6feb"/>
    <text x="334" y="86" text-anchor="middle" font-weight="600" fill="#79c0ff">workspace</text>
    <text x="334" y="102" text-anchor="middle" font-size="10.5" fill="#8b949e">32-byte slots: variables first,</text>
    <text x="334" y="115" text-anchor="middle" font-size="10.5" fill="#8b949e">then scratch (SlotAllocator)</text>

    <rect x="424" y="62" width="48" height="64" fill="#2d2305" stroke="#9e6a03"/>
    <text x="448" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#d29922">guard</text>
    <text x="448" y="104" text-anchor="middle" font-size="9.5" fill="#d29922">256 B</text>

    <rect x="472" y="62" width="180" height="64" fill="#21262d" stroke="#30363d"/>
    <text x="562" y="86" text-anchor="middle" font-weight="600" fill="#8b949e">runtime statics</text>
    <text x="562" y="102" text-anchor="middle" font-size="10.5" fill="#8b949e">+ shadow stack &#8212;</text>
    <text x="562" y="115" text-anchor="middle" font-size="10.5" fill="#8b949e">off-limits to codegen</text>

    <rect x="652" y="62" width="252" height="64" fill="#04260f" stroke="#2ea043"/>
    <text x="778" y="86" text-anchor="middle" font-weight="600" fill="#3fb950">dlmalloc heap</text>
    <text x="778" y="102" text-anchor="middle" font-size="10.5" fill="#3fb950">everything allocated</text>
    <text x="778" y="115" text-anchor="middle" font-size="10.5" fill="#3fb950">after instantiation</text>

    <line x1="904" y1="94" x2="922" y2="94" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="913" y="84" text-anchor="middle" font-size="9.5" fill="#3fb950">grows</text>
  </g>

  <!-- ticks -->
  <g stroke="#8b949e" stroke-width="1">
    <line x1="16" y1="126" x2="16" y2="136"/>
    <line x1="64" y1="126" x2="64" y2="136"/>
    <line x1="244" y1="126" x2="244" y2="136"/>
    <line x1="472" y1="126" x2="472" y2="136"/>
    <line x1="652" y1="126" x2="652" y2="136"/>
  </g>
  <g font-size="11" fill="#e6edf3">
    <text x="16" y="150" text-anchor="middle" font-weight="600">0</text>
    <text x="64" y="150" text-anchor="middle">16</text>
    <text x="244" y="150" text-anchor="middle">ws_base</text>
    <text x="472" y="150" text-anchor="middle" font-weight="600">8192</text>
    <text x="652" y="150" text-anchor="middle" font-weight="600">__heap_base</text>
  </g>
  <text x="16" y="170" font-size="10.5" fill="#8b949e">expression module writes below 8192 only &#8212; gated at compile (LayoutPass) and at Plan (slot-extent check)</text>
  <text x="16" y="186" font-size="10.5" fill="#8b949e">8192 = --global-base (CELWASM_RESERVED_LOW_MEMORY_BYTES)</text>

  <!-- heap contents -->
  <g font-size="12">
    <rect x="236" y="208" width="688" height="76" rx="8" fill="none" stroke="#2ea043" stroke-dasharray="5,4"/>
    <line x1="778" y1="126" x2="778" y2="208" stroke="#2ea043" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="228" y="250" text-anchor="end" font-size="11" fill="#3fb950">inside the heap:</text>

    <rect x="252" y="220" width="208" height="52" rx="6" fill="#0d1117" stroke="#2ea043"/>
    <text x="356" y="238" text-anchor="middle" font-weight="600" fill="#3fb950">per-Eval arena</text>
    <text x="356" y="252" text-anchor="middle" font-size="10.5" fill="#8b949e">chained bump chunks, 64 KiB initial;</text>
    <text x="356" y="264" text-anchor="middle" font-size="10.5" fill="#8b949e">reset at the top of every $eval</text>

    <rect x="476" y="220" width="208" height="52" rx="6" fill="#0d1117" stroke="#2ea043"/>
    <text x="580" y="238" text-anchor="middle" font-weight="600" fill="#3fb950">activation buffer</text>
    <text x="580" y="252" text-anchor="middle" font-size="10.5" fill="#8b949e">bound-variable payloads;</text>
    <text x="580" y="264" text-anchor="middle" font-size="10.5" fill="#8b949e">outside the arena &#8212; survives reset</text>

    <rect x="700" y="220" width="208" height="52" rx="6" fill="#0d1117" stroke="#2ea043"/>
    <text x="804" y="238" text-anchor="middle" font-weight="600" fill="#3fb950">Plan-lifetime objects</text>
    <text x="804" y="252" text-anchor="middle" font-size="10.5" fill="#8b949e">RE2 cache,</text>
    <text x="804" y="264" text-anchor="middle" font-size="10.5" fill="#8b949e">parsed timestamps, &#8230;</text>
  </g>

  <!-- CelValue cell -->
  <text x="16" y="322" font-size="13" font-weight="600" fill="#e6edf3">The 24-byte CelValue cell (runtime/cel_data.h)</text>
  <g font-size="12">
    <rect x="16" y="334" width="120" height="52" fill="#0c2d6b" stroke="#1f6feb"/>
    <text x="76" y="356" text-anchor="middle" font-weight="600" fill="#79c0ff">kind</text>
    <text x="76" y="372" text-anchor="middle" font-size="10.5" fill="#79c0ff">u32</text>

    <rect x="136" y="334" width="100" height="52" fill="#21262d" stroke="#30363d"/>
    <text x="186" y="356" text-anchor="middle" font-weight="600" fill="#8b949e">_pad</text>
    <text x="186" y="372" text-anchor="middle" font-size="10.5" fill="#8b949e">u32</text>

    <rect x="236" y="334" width="540" height="52" fill="#0d1117" stroke="#1f6feb"/>
    <text x="506" y="356" text-anchor="middle" font-weight="600" fill="#79c0ff">payload &#8212; 16 bytes</text>
    <text x="506" y="372" text-anchor="middle" font-size="10.5" fill="#8b949e">scalar inline &#183; string/bytes {ptr, len} &#183; arena header offset &#183; message handle</text>
  </g>
  <g font-size="10.5" fill="#e6edf3">
    <text x="16" y="402">+0</text>
    <text x="136" y="402">+4</text>
    <text x="236" y="402">+8</text>
    <text x="776" y="402" text-anchor="end">+24</text>
  </g>
  <g font-size="10.5" fill="#8b949e">
    <text x="792" y="354">slots are i32 byte-offsets</text>
    <text x="792" y="368">of these cells; helpers:</text>
    <text x="792" y="382">(out_slot, args&#8230;) &#8594; void</text>
  </g>
</svg>
