<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Trust boundaries: host process vs wasmtime sandbox vs plugin sandbox.
       Facts: design/00 §4, design/05, user-guide/security-model.
       Per-call costs: benchmark/plugin/plugin_bench (2026-07-22).
       Hand-authored; keep in sync with the docs. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8c959f"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#54aeff"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c297ff"/>
    </marker>
  </defs>

  <!-- host process -->
  <rect x="12" y="32" width="290" height="256" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="22" font-size="13" font-weight="600" fill="#57606a">HOST PROCESS &#183; trusted</text>

  <g font-size="13">
    <rect x="28" y="52" width="258" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="157" y="76" text-anchor="middle" font-weight="600" fill="#1f2328">your application</text>
    <text x="157" y="94" text-anchor="middle" font-size="11" fill="#57606a">protos &#183; policy data</text>

    <rect x="28" y="128" width="258" height="56" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="157" y="152" text-anchor="middle" font-weight="600" fill="#1f2328">Engine / Instance</text>
    <text x="157" y="170" text-anchor="middle" font-size="11" fill="#57606a">wasmtime embedder</text>

    <rect x="28" y="204" width="258" height="56" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="157" y="228" text-anchor="middle" font-weight="600" fill="#0969da">@host functions</text>
    <text x="157" y="246" text-anchor="middle" font-size="11" fill="#0969da">in-process, full trust &#183; ~110 ns/call</text>
  </g>

  <!-- wasmtime sandbox -->
  <rect x="330" y="32" width="330" height="256" rx="10" fill="#dafbe1" fill-opacity="0.35" stroke="#4ac26b" stroke-dasharray="6,4"/>
  <text x="342" y="22" font-size="13" font-weight="600" fill="#1a7f37">WASMTIME SANDBOX</text>

  <g font-size="13">
    <rect x="346" y="52" width="298" height="66" rx="6" fill="#ffffff" stroke="#4ac26b"/>
    <text x="495" y="76" text-anchor="middle" font-weight="600" fill="#1a7f37">compiled expression</text>
    <text x="495" y="94" text-anchor="middle" font-size="11" fill="#57606a">your CEL, as machine code</text>

    <rect x="346" y="152" width="298" height="66" rx="6" fill="#ffffff" stroke="#4ac26b"/>
    <text x="495" y="176" text-anchor="middle" font-weight="600" fill="#1a7f37">cel_runtime.wasm kernel</text>
    <text x="495" y="194" text-anchor="middle" font-size="11" fill="#57606a">shared linear memory</text>
  </g>
  <text x="495" y="252" text-anchor="middle" font-size="11.5" fill="#1a7f37">no syscalls &#183; no I/O &#183; bounded memory</text>
  <text x="495" y="270" text-anchor="middle" font-size="11.5" fill="#1a7f37">nothing here can reach the host unmediated</text>

  <!-- plugin sandbox -->
  <rect x="688" y="32" width="240" height="256" rx="10" fill="#fbefff" fill-opacity="0.5" stroke="#c297ff" stroke-dasharray="6,4"/>
  <text x="700" y="22" font-size="13" font-weight="600" fill="#8250df">PLUGIN SANDBOX</text>

  <g font-size="13">
    <rect x="704" y="92" width="208" height="76" rx="6" fill="#ffffff" stroke="#c297ff"/>
    <text x="808" y="116" text-anchor="middle" font-weight="600" fill="#8250df">@plugin functions</text>
    <text x="808" y="134" text-anchor="middle" font-size="11" fill="#57606a">untrusted custom code</text>
    <text x="808" y="150" text-anchor="middle" font-size="11" fill="#57606a">~450 ns/call</text>
  </g>
  <text x="808" y="252" text-anchor="middle" font-size="11.5" fill="#8250df">own linear memory &#183;</text>
  <text x="808" y="270" text-anchor="middle" font-size="11.5" fill="#8250df">no host access at all</text>

  <!-- arrows -->
  <g stroke-width="1.5" fill="none">
    <line x1="286" y1="156" x2="344" y2="156" stroke="#8c959f" marker-end="url(#arr)"/>
    <path d="M 346 100 C 320 130, 300 180, 288 216" stroke="#54aeff" marker-end="url(#arrb)" marker-start="url(#arrb)"/>
    <path d="M 644 100 C 672 108, 680 116, 702 124" stroke="#c297ff" marker-end="url(#arrp)" marker-start="url(#arrp)"/>
    <line x1="495" y1="118" x2="495" y2="150" stroke="#8c959f" marker-end="url(#arr)"/>
  </g>
  <text x="316" y="140" text-anchor="middle" font-size="11" fill="#57606a">Plan / Eval</text>
  <text x="296" y="188" text-anchor="start" font-size="10.5" fill="#0969da">cel_host trampolines</text>
  <text x="296" y="202" text-anchor="start" font-size="10.5" fill="#0969da">(host-mediated)</text>
  <text x="668" y="84" text-anchor="middle" font-size="10.5" fill="#8250df">value marshal</text>
  <text x="668" y="98" text-anchor="middle" font-size="10.5" fill="#8250df">(host-mediated)</text>
  <text x="510" y="140" text-anchor="start" font-size="10.5" fill="#57606a">cel.* calls</text>

  <!-- caption -->
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#57606a">trust decreases left to right &#8212; host functions run in your process; plugin functions never leave their own memory</text>
</svg>
