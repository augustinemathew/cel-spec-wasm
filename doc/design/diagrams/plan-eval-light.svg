<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Engine::Plan -> Instance::Eval lifecycle. Facts: design/02 §1-2, §5.
       Hand-authored; keep in sync with the doc. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- PLAN band -->
  <rect x="12" y="30" width="916" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="20" font-size="13" font-weight="600" fill="#57606a">PLAN &#183; once per evaluator &#183; expensive &#183; concurrent-safe</text>

  <g font-size="13">
    <rect x="28" y="52" width="128" height="62" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="92" y="78" text-anchor="middle" font-weight="600" fill="#0969da">Program</text>
    <text x="92" y="96" text-anchor="middle" font-size="11" fill="#0969da">.wasm + cel.abi</text>

    <rect x="184" y="52" width="148" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="258" y="74" text-anchor="middle" font-weight="600" fill="#1f2328">decode cel.abi</text>
    <text x="258" y="92" text-anchor="middle" font-size="11" fill="#57606a">ABI-version gate &#183;</text>
    <text x="258" y="106" text-anchor="middle" font-size="11" fill="#57606a">bind host env</text>

    <rect x="360" y="52" width="148" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="434" y="74" text-anchor="middle" font-weight="600" fill="#1f2328">Cranelift JIT</text>
    <text x="434" y="92" text-anchor="middle" font-size="11" fill="#57606a">wasm bytes &#8594;</text>
    <text x="434" y="106" text-anchor="middle" font-size="11" fill="#57606a">machine code</text>

    <rect x="536" y="52" width="180" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="626" y="74" text-anchor="middle" font-weight="600" fill="#1f2328">instantiate</text>
    <text x="626" y="92" text-anchor="middle" font-size="11" fill="#57606a">wire memory &#183; arena_init</text>
    <text x="626" y="106" text-anchor="middle" font-size="11" fill="#57606a">static &#8596; dynamic by imports</text>

    <rect x="744" y="52" width="168" height="62" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="828" y="78" text-anchor="middle" font-weight="600" fill="#0969da">Instance</text>
    <text x="828" y="96" text-anchor="middle" font-size="11" fill="#0969da">live evaluator &#183; thread-owned</text>
  </g>

  <!-- EVAL band -->
  <rect x="12" y="172" width="916" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="162" font-size="13" font-weight="600" fill="#57606a">EVAL &#183; every request &#183; no parse, no JIT</text>

  <g font-size="13">
    <rect x="28" y="194" width="140" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="98" y="220" text-anchor="middle" font-weight="600" fill="#1f2328">Activation</text>
    <text x="98" y="238" text-anchor="middle" font-size="11" fill="#57606a">name &#8594; Value</text>

    <rect x="196" y="194" width="170" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="281" y="216" text-anchor="middle" font-weight="600" fill="#1f2328">marshal bindings</text>
    <text x="281" y="234" text-anchor="middle" font-size="11" fill="#57606a">write each variable</text>
    <text x="281" y="248" text-anchor="middle" font-size="11" fill="#57606a">into its ABI slot</text>

    <rect x="394" y="194" width="150" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="469" y="216" text-anchor="middle" font-weight="600" fill="#1f2328">call $eval</text>
    <text x="469" y="234" text-anchor="middle" font-size="11" fill="#57606a">arena reset first &#183;</text>
    <text x="469" y="248" text-anchor="middle" font-size="11" fill="#57606a">returns result offset</text>

    <rect x="572" y="194" width="160" height="62" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="652" y="216" text-anchor="middle" font-weight="600" fill="#1f2328">decode result</text>
    <text x="652" y="234" text-anchor="middle" font-size="11" fill="#57606a">read the CelValue cell,</text>
    <text x="652" y="248" text-anchor="middle" font-size="11" fill="#57606a">deep-copy out</text>

    <rect x="760" y="194" width="152" height="62" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="836" y="220" text-anchor="middle" font-weight="600" fill="#1a7f37">Value</text>
    <text x="836" y="238" text-anchor="middle" font-size="11" fill="#1a7f37">kind-tagged result</text>
  </g>

  <!-- arrows -->
  <g stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)" fill="none">
    <line x1="156" y1="83" x2="182" y2="83"/>
    <line x1="332" y1="83" x2="358" y2="83"/>
    <line x1="508" y1="83" x2="534" y2="83"/>
    <line x1="716" y1="83" x2="742" y2="83"/>
    <path d="M 828 114 C 828 150, 500 150, 471 192"/>
    <line x1="168" y1="225" x2="194" y2="225"/>
    <line x1="366" y1="225" x2="392" y2="225"/>
    <line x1="544" y1="225" x2="570" y2="225"/>
    <line x1="732" y1="225" x2="758" y2="225"/>
  </g>
  <text x="924" y="152" text-anchor="end" font-size="11" fill="#57606a">Instance.Eval(activation) &#8212; reused across calls</text>

  <!-- captions -->
  <text x="470" y="302" text-anchor="middle" font-size="12" fill="#57606a">Plan once per Program per thread &#183; Eval in the request loop &#8212; the arena resets, nothing is re-parsed or re-JITted</text>
</svg>
