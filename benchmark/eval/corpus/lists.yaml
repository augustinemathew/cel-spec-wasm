# Membership-in-list surface — bench-shape cells.
#
# `a in [...]` patterns at sizes 5, 20, 100, each in two flavors:
#   - var-bound `a`     : `a` is bound in activation to the LAST list
#                         element so the `in` scan walks the whole
#                         list before hitting (worst case).
#   - literal           : `"<elem>" in [...]` — no var path; same
#                         scan-the-whole-list cost.
#
# Surface `lists` maps to BM prefix `in_list`, so cell id `5` becomes
# `BM_in_list_5`.  Cell ids are quoted so yaml-cpp parses them as
# strings (not ints), keeping the `(surface, id)` join key uniform.

schema_version: 1
surface: lists

cells:

  - id: "5"
    source: 'a in ["123","augustine","jess","bob","alice"]'
    activation:
      a: { type: string, value: "alice" }
    expected: { type: bool, value: true }
    tags: [phase1, bench-shape]

