  - id: bound1000000
    source: 'x in xs'
    activation:
      x: { type: int, value: 999998 }
      xs: { type: list, elem: int, gen: { range: 1000000 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  # 1M early-exit / not-present companions: first element (scan stops
  # at index 0) and an absent needle (-1, outside [0, 999999] — full
  # scan, returns false).  The three 1M cells bracket the scan cost:
  # first ≈ fixed overhead, worst ≈ full hit scan, miss ≈ full no-hit
  # scan.
  - id: bound1000000_first
    source: 'x in xs'
    activation:
      x: { type: int, value: 0 }
      xs: { type: list, elem: int, gen: { range: 1000000 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: bound1000000_miss
    source: 'x in xs'
    activation:
      x: { type: int, value: -1 }
      xs: { type: list, elem: int, gen: { range: 1000000 } }
    expected: { type: bool, value: false }
    tags: [phase2, bench-shape]

  # ── BOUND IAM-permission string lists `perm in perms` ──
  # Each generated permission is exactly 50 bytes: the 43-byte
  # GCP-IAM-shaped prefix "cloudkms.cryptoKeyVersions.useToSignBytes.v"
  # (a real permission + the version-suffix convention) + 7 zero-padded
  # index digits, mirroring the legacy bench/in_operator_bench.cc
  # MakeIamPermissions fixed-length discipline so every entry has the
  # same strcmp cost.  `perm` is bound to the LAST generated element
  # (index N-1) — worst-case full scan.
  # NOTE: the legacy bench capped this shape at N=1000 — at N=10000 the
  # bound-string scan exhausted the per-Eval arena ("arena OOM in
  # CelMapLookupImpl"); do not extend the sweep without fixing that.
  - id: iam100
    source: 'perm in perms'
    activation:
      perm: { type: string, value: "cloudkms.cryptoKeyVersions.useToSignBytes.v0000099" }
      perms: { type: list, elem: string,
               gen: { template: "cloudkms.cryptoKeyVersions.useToSignBytes.v%07d", count: 100 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: iam1000
    source: 'perm in perms'
    activation:
      perm: { type: string, value: "cloudkms.cryptoKeyVersions.useToSignBytes.v0000999" }
      perms: { type: list, elem: string,
               gen: { template: "cloudkms.cryptoKeyVersions.useToSignBytes.v%07d", count: 1000 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  # 1k early-exit / not-present companions.  The miss needle keeps the
  # 50-byte length (index 9999999 is outside [0, 999]) so the per-entry
  # compare cost is identical to the hit cells.
  - id: iam1000_first
    source: 'perm in perms'
    activation:
      perm: { type: string, value: "cloudkms.cryptoKeyVersions.useToSignBytes.v0000000" }
      perms: { type: list, elem: string,
               gen: { template: "cloudkms.cryptoKeyVersions.useToSignBytes.v%07d", count: 1000 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: iam1000_miss
    source: 'perm in perms'
