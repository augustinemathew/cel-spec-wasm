  # (second-to-last): the scan walks the whole list before hitting —
  # worst case, matching the literal cells above.
  - id: bound100
    source: 'x in xs'
    activation:
      x: { type: int, value: 98 }
      xs: { type: list, elem: int, gen: { range: 100 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: bound1000
    source: 'x in xs'
    activation:
      x: { type: int, value: 998 }
      xs: { type: list, elem: int, gen: { range: 1000 } }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: bound10000
    source: 'x in xs'
