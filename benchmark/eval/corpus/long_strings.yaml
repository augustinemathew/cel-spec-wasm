# Long-string sweep — bench-shape cells.
#
# Sweeps haystack length N ∈ {10, 100, 1000, 10000} across three
# patterns:
#   eqLong_N<N>_match    — `a == "xxx..."` where `a` matches exactly
#   eqLong_N<N>_mismatch — `a == "xxx..."` where `a` differs at last byte
#   containsLong_N<N>    — `a.contains("yyy")` where the needle is
#                          absent and the search walks the whole `a`
#
# Surface `long_strings` maps to BM prefix `str` (so id
# `eqLong_N1000_match` → `BM_str_eqLong_N1000_match`).
#
# The long literals are inlined as YAML double-quoted strings.
# YAML's double-quote form requires escaping of `"` and `\` only,
# and the `xxx…` / `yyy` payload uses neither.  The CEL source
# strings (inside the YAML `source` field) are single-quoted on
# the YAML side and double-quoted on the CEL side, which keeps the
# nested-quote story tractable.

# The three N=10000 cells (~10 KB string literal each) now fit the
# 256 KiB low-memory window and run on celwasm as well as celcpp_bench;
# N ∈ {10, 100, 1000} run on both too.
#
# HISTORICAL CORRECTNESS FINDING (2026-06-09, when the window was 8 KB):
# a 10 KB literal pushed the expression rodata past the window, and
# the two link modes diverged — static REJECTED loudly at compile,
# while dynamic COMPILED and SILENTLY returned the wrong answer
# (`a == "<10000 x's>"` with `a` bound to the same string evaluated
# false; cel-cpp: true).  Both halves are closed now: the window raise
# admits the literal, and the compile-time rodata gate
# (`CheckStaticWindowFits` in layout_pass.cc) rejects an over-budget
# layout loudly in BOTH link modes before it can miscompile.

schema_version: 1
surface: long_strings

cells:

  - id: eqLong_N10_match
    source: 'a == "xxxxxxxxxx"'
    activation:
      a: { type: string, value: "xxxxxxxxxx" }
    expected: { type: bool, value: true }
    tags: [phase1, bench-shape]

  - id: eqLong_N10_mismatch
    source: 'a == "xxxxxxxxxx"'
    activation:
      a: { type: string, value: "xxxxxxxxxy" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]

  - id: containsLong_N10
    source: 'a.contains("yyy")'
    activation:
      a: { type: string, value: "xxxxxxxxxx" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape, skip-source-check]

  - id: eqLong_N100_match
    source: 'a == "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"'
    activation:
      a: { type: string, value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
    expected: { type: bool, value: true }
    tags: [phase1, bench-shape]

  - id: eqLong_N100_mismatch
    source: 'a == "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"'
    activation:
      a: { type: string, value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxy" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]

  - id: containsLong_N100
    source: 'a.contains("yyy")'
    activation:
      a: { type: string, value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape, skip-source-check]

  - id: eqLong_N1000_match
    source: 'a == ""'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: true }
    tags: [phase1, bench-shape]

  - id: eqLong_N1000_mismatch
    source: 'a == ""'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]

  - id: containsLong_N1000
    source: 'a.contains("yyy")'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape, skip-source-check]

  - id: eqLong_N10000_match
    source: 'a == ""'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: true }
    tags: [phase1, bench-shape]

  - id: eqLong_N10000_mismatch
    source: 'a == ""'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]

  - id: containsLong_N10000
    source: 'a.contains("yyy")'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape, skip-source-check]

  # indexOf companions of the containsLong cells: same absent-needle
  # full scan, but the kernel must also COUNT code points as it goes
  # (the anchor scan bulk-advances across pure-ASCII blocks).  Result
  # is -1: no match.
  - id: indexOfLong_N1000
    source: 'a.indexOf("yyy")'
    activation:
      a: { type: string, value: "" }
    expected: { type: int, value: -1 }
    tags: [phase2, bench-shape, skip-source-check]

  - id: indexOfLong_N10000
    source: 'a.indexOf("yyy")'
    activation:
      a: { type: string, value: "" }
    expected: { type: int, value: -1 }
    tags: [phase2, bench-shape, skip-source-check]


  # ── string-equality edge shapes (added 2026-06-09) ──
  # The match/mismatch pairs above mismatch at the LAST byte (worst
  # case, full scan).  These two shapes complete the equality story:
  # first-byte mismatch should be ~flat across lengths iff the
  # comparison early-exits; length mismatch should be O(1) via the
  # size check before any byte compare.

  - id: eqLong_N100_mismatch_first
    source: 'a == "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"'
    activation:
      a: { type: string, value: "yxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]

  - id: eqLong_N1000_mismatch_first
    source: 'a == ""'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]

  - id: eqLong_N1000_mismatch_len
    source: 'a == ""'
    activation:
      a: { type: string, value: "" }
    expected: { type: bool, value: false }
    tags: [phase1, bench-shape]
