  - id: doubleLe
    source: 'a <= b'
    activation:
      a: { type: double, value: 2.5 }
      b: { type: double, value: 2.5 }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: doubleGt
    source: 'a > b'
    activation:
      a: { type: double, value: 3.5 }
      b: { type: double, value: 2.5 }
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape]

  - id: doubleGe
    source: 'a >= b'
    activation:
      a: { type: double, value: 3.5 }
      b: { type: double, value: 3.5 }
    expected: { type: bool, value: true }
