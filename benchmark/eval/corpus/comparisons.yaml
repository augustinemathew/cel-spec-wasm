  # ── literal-operand twins (`…Const`) of every scalar-comparison var
  # cell above.  Each mirrors its sibling's operator + result; the
  # (var − const) delta isolates the per-Eval variable-binding cost.
  # timestamp/duration/list/map/null operands stay literal-only (the
  # loader cannot bind those types) and have no `…Const` twin — they
  # ARE the literal form already.
  # int
  - id: intEqConst
    source: "42 == 42"
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape, const-only]

  - id: intNeConst
    source: "42 != 43"
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape, const-only]

  - id: intLeConst
    source: "2 <= 2"
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape, const-only]

  - id: intGtConst
    source: "3 > 2"
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape, const-only]

  - id: intGeConst
    source: "3 >= 3"
    expected: { type: bool, value: true }
    tags: [phase2, bench-shape, const-only]

