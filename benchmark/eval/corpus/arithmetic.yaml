# Arithmetic surface — bench-shape cells.
#
# Each cell here corresponds to a Google Benchmark cell registered by
# both `celwasm_bench` and `celcpp_bench`.  The bench main maps the
# cell id 1:1 onto a BM name via the (surface → bm_prefix) table —
# for `arithmetic`, the prefix is `arith`, so cell id `intAdd10Terms`
# becomes `BM_arith_intAdd10Terms`.
#
# Length-sweep design (mirrors DESIGN.md §6.4): every binary operator
# is measured at N ∈ {2, 10, 50, 250, 1000} so the reporter can
# decompose T(N) = setup + N · per_op via linear regression.  Four
# operators — intAdd / intMul / intSub / doubleAdd — span int + double
# arithmetic surfaces.
#
# Variable bindings: every var is `1` (or `1.0` for double).  This
# was the deliberate choice in the original C++ hand-coded form: a
# 1000-term `intMul` chain cycled through distinct primes (2,3,5,…,29)
# would overflow int64 in two cycles and cel-cpp would return an eval
# error per spec, killing the bench.  Eval cost of int64 add/mul/sub is
# independent of magnitude, so the timing signal is preserved.
#
# Const variants (`*Const`) strip variables entirely — the source is
# pure literals (`1 + 1 + ... + 1`).  The compiler is built with no
# variables, the activation is empty.  Lets us isolate
# variable-resolution + activation-marshaling cost from pure
# arithmetic-helper cost: any per-term-slope gap between var and const
# cells attributes to the variable path.
#
# `*1000TermsConst` cells store each literal as its own 24-byte
# CelValue in rodata, so 1000 literals = 24 KB — which now fits the
# 256 KiB low-memory window, so both celwasm_bench and celcpp_bench
# run these cells.

