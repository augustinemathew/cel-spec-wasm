  # ── 1000-term mixed polynomial (the legacy bench/in_operator_bench.cc
  #    long-arith shape) ──
  # Term i is `var[i%10] * var[(i*7+3)%10]` summed over i in [0, 1000):
  # the (i*7+3)%10 stride hits every var with no two adjacent terms
  # identical, so a trivial CSE pass can't collapse the expression on
  # either side (Binaryen on ours, the tree-walking evaluator on
  # cel-cpp's).  1000 multiplications + 999 additions over 10 distinct
  # int inputs bound to the first 10 primes — small enough that the
  # int64 sum cannot overflow (each term <= 29*29; total 200000).
  # Expected value computed offline: the term pattern repeats every 10
  # terms, each block summing to 2000; 100 blocks = 200000.
